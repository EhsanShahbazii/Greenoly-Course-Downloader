name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.tag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            tag: macos-arm64
          - os: macos-15-intel
            tag: macos-x64
          - os: windows-latest
            tag: windows-x64
          - os: ubuntu-latest
            tag: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Install Linux browser system libraries
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium

      - name: Build standalone app
        run: python build.py

      - name: Test extracted portable archive
        run: python scripts/verify_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: GreenOly-${{ matrix.tag }}
          path: dist/GreenOly-*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
